{% extends 'internal_base.html' %}
{% block title %}Alterar senha · Uso interno{% endblock %}
{% block internal_content %}
<section class="card password-card"><h1>{{ 'Defina sua senha' if user.must_change_password else 'Alterar senha' }}</h1><p class="muted">{{ user.name }}, escolha uma senha pessoal com pelo menos 8 caracteres.</p>
<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Senha atual / provisória<input type="password" name="current_password" required autocomplete="current-password" maxlength="128"></label>
<label>Nova senha<input type="password" name="password" required autocomplete="new-password" minlength="8" maxlength="128"></label>
<label>Repita a nova senha<input type="password" name="password_confirm" required autocomplete="new-password" minlength="8" maxlength="128"></label><button class="primary">Salvar nova senha</button></form></section>
{% endblock %}
