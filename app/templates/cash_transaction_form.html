{% extends "base.html" %}{% block title %}Lançamento financeiro{% endblock %}{% block content %}
<div class="page-head"><div><h1>{{'Editar' if tx else 'Novo'}} lançamento</h1><p class="muted">Entradas, saídas e transferências entre contas.</p></div><a class="button" href="/admin/financeiro">Voltar</a></div>
{% if error %}<div class="alert">{{error}}</div>{% endif %}
<form method="post" class="card stack narrow-form">
<label>Data<input type="date" name="transaction_date" value="{{tx.transaction_date.isoformat() if tx else today.isoformat()}}" required></label>
<label>Tipo<select name="transaction_type" id="tx-type" required><option value="income" {% if tx and tx.transaction_type=='income' %}selected{% endif %}>Entrada</option><option value="expense" {% if tx and tx.transaction_type=='expense' %}selected{% endif %}>Saída</option>{% if not tx %}<option value="transfer">Transferência entre contas</option>{% endif %}</select></label>
<label>Conta de origem / conta do lançamento<select name="account_id" required>{% for a in accounts if a.active %}<option value="{{a.id}}" {% if tx and tx.account_id==a.id %}selected{% endif %}>{{a.name}}</option>{% endfor %}</select></label>
<div id="destination-row" style="display:none"><label>Conta de destino<select name="destination_account_id"><option value="">Selecione...</option>{% for a in accounts if a.active %}<option value="{{a.id}}">{{a.name}}</option>{% endfor %}</select></label></div>
<label id="group-row">Grupo de contas<select name="group_id"><option value="">Sem grupo / classificar depois</option>{% for g in groups if g.active and g.nature!='transfer' %}<option value="{{g.id}}" {% if tx and tx.group_id==g.id %}selected{% endif %}>{{g.name}} ({{'Entrada' if g.nature=='income' else 'Saída'}})</option>{% endfor %}</select></label>
<label>Descrição<input name="description" value="{{tx.description if tx else ''}}" required></label>
<label>Valor (R$)<input name="amount" inputmode="decimal" value="{{'%.2f'|format(tx.amount)|replace('.', ',') if tx else ''}}" required></label>
<label>Favorecido / pagador<input name="counterparty" value="{{tx.counterparty or '' if tx else ''}}"></label>
<label>Documento<input name="document_number" value="{{tx.document_number or '' if tx else ''}}"></label>
<label>Observações<textarea name="notes">{{tx.notes or '' if tx else ''}}</textarea></label>
{% if tx %}<label class="check"><input type="checkbox" name="reconciled" value="1" {% if tx.reconciled %}checked{% endif %}> Lançamento conciliado/conferido</label>{% endif %}
<div class="form-actions"><button class="primary">Salvar</button><a class="button" href="/admin/financeiro">Cancelar</a></div>
</form>
<script>const t=document.getElementById('tx-type'),d=document.getElementById('destination-row'),g=document.getElementById('group-row');function sync(){const is=t.value==='transfer';d.style.display=is?'block':'none';g.style.display=is?'none':'grid'}t.addEventListener('change',sync);sync();</script>
{% endblock %}
