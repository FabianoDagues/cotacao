<form class="card product-filter no-print" method="get" action="/admin/baixas">
<label>Data inicial<input type="date" name="inicio" value="{{start}}"></label><label>Data final<input type="date" name="fim" value="{{end}}"></label>
{% if user.role=='admin' %}<label>Setor<select name="setor"><option value="">Todos</option><option value="sem" {% if sector=='sem' %}selected{% endif %}>Sem setor (histórico)</option>{% for d in departments %}<option value="{{d.id}}" {% if sector==d.id|string %}selected{% endif %}>{{d.name}}</option>{% endfor %}</select></label><label>Usuário<select name="usuario"><option value="">Todos</option>{% for id,name in operators.items() %}<option value="{{id}}" {% if operator==id|string %}selected{% endif %}>{{name}}</option>{% endfor %}</select></label>{% endif %}
<label>Motivo<select name="motivo"><option value="">Todos</option>{% for r in reasons %}<option {% if reason==r %}selected{% endif %}>{{r}}</option>{% endfor %}</select></label><label>Produto / código<input name="busca" type="search" value="{{search}}"></label><label class="check"><input type="checkbox" name="canceladas" value="1" {% if show_cancelled %}checked{% endif %}> Incluir canceladas no histórico</label>
<div class="form-actions"><button name="relatorio" value="0" class="primary">Listar baixas</button><button name="relatorio" value="1">Totalizar por produto</button><a class="button" href="/admin/baixas">Limpar</a></div></form>
